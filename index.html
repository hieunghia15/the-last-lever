<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#000000" />
    <title>The Last Lever</title>
    <!--
      Inline, not in style.css: that file arrives with the script, and until then the overlay
      below would show unstyled on a white page, on every load and on desktop too.
    -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
      }

      /* Portrait phones only: a narrow desktop window has a fine pointer and never sees this. */
      #rotate-overlay {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        padding: 0 32px;
        background: #14100c;
        color: #f2a93b;
        text-align: center;
      }

      #rotate-overlay p {
        margin: 0;
        color: #f3e6d0;
        font-family: 'Saira Stencil', system-ui, sans-serif;
        font-size: 20px;
      }

      @media (orientation: portrait) and (pointer: coarse) {
        #rotate-overlay {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="rotate-overlay" aria-live="polite">
      <svg viewBox="0 0 64 64" width="96" height="96" aria-hidden="true">
        <rect
          x="22"
          y="8"
          width="20"
          height="36"
          rx="3"
          fill="none"
          stroke="currentColor"
          stroke-width="3"
        />
        <rect
          x="10"
          y="38"
          width="36"
          height="20"
          rx="3"
          fill="none"
          stroke="currentColor"
          stroke-width="3"
          opacity="0.45"
        />
        <path d="M48 20 a14 14 0 0 1 6 18" fill="none" stroke="currentColor" stroke-width="3" />
        <path d="M50 36 l4 4 l3 -5" fill="none" stroke="currentColor" stroke-width="3" />
      </svg>
      <p id="rotate-message"></p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
